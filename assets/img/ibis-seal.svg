<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="t">
  <title id="t">Engraved ibis seal</title>
  <defs>
    <path id="arc-top" d="M30,120 A90,90 0 0,1 210,120"/>
    <path id="arc-bottom" d="M21,120 A99,99 0 0,0 219,120"/>
    <clipPath id="inner"><circle cx="120" cy="120" r="77"/></clipPath>
    <path id="body-shape" d="M100,116 C108,98 140,92 164,100 C182,107 192,120 188,134 C184,148 160,154 136,152 C116,150 102,140 100,128 Z"/>
    <clipPath id="body"><use href="#body-shape"/></clipPath>
    <pattern id="hatch" width="3.2" height="3.2" patternUnits="userSpaceOnUse" patternTransform="rotate(-24)">
      <line x1="0" y1="0" x2="0" y2="3.2" stroke="#1D2F4A" stroke-width=".8"/>
    </pattern>
  </defs>

  <!-- Seal rings and motto -->
  <circle cx="120" cy="120" r="117" fill="#EEF0EA" stroke="#1D2F4A" stroke-width="2.5"/>
  <circle cx="120" cy="120" r="111" fill="none" stroke="#1D2F4A" stroke-width=".8"/>
  <circle cx="120" cy="120" r="80" fill="none" stroke="#1D2F4A" stroke-width=".8"/>
  <circle cx="120" cy="120" r="77" fill="#F8F9F5" stroke="#1D2F4A" stroke-width="1.6"/>
  <g font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12.5" font-weight="500" fill="#1D2F4A" letter-spacing="2.6" text-anchor="middle">
    <text><textPath href="#arc-top" startOffset="50%">JUDGE IT BY ITS WORK</textPath></text>
    <text><textPath href="#arc-bottom" startOffset="50%">NOT ITS NICKNAME</textPath></text>
  </g>
  <circle cx="22" cy="120" r="2.2" fill="#1D2F4A"/>
  <circle cx="218" cy="120" r="2.2" fill="#1D2F4A"/>

  <g clip-path="url(#inner)">
    <!-- Ground contours and datum point -->
    <g fill="none" stroke="#C98F4E" stroke-width=".9">
      <path d="M40,184 C80,174 160,174 200,186"/>
      <path d="M40,194 C84,186 156,186 200,196"/>
      <path d="M40,204 C88,198 152,198 200,206"/>
    </g>
    <circle cx="104" cy="182" r="2.6" fill="#B23A2E"/>

    <g transform="translate(-8 2)">
    <!-- Legs -->
    <g stroke="#1D2F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M138,151 L135,166 L137,181"/>
      <path d="M154,150 L158,166 L155,181"/>
      <path d="M128,181.5 L137,181 L145,182.5 M137,181 L133,184"/>
      <path d="M147,181.5 L155,181 L164,182.5 M155,181 L151,184"/>
    </g>

    <!-- White body with engraved shading -->
    <use href="#body-shape" fill="#FFFFFF" stroke="#1D2F4A" stroke-width="1.6"/>
    <g clip-path="url(#body)">
      <path d="M92,134 C120,156 170,158 196,128 L196,170 L92,170 Z" fill="url(#hatch)"/>
    </g>
    <!-- Folded wing feathers -->
    <g fill="none" stroke="#1D2F4A" stroke-width=".9" stroke-linecap="round">
      <path d="M120,108 C138,102 160,105 178,116"/>
      <path d="M124,116 C142,111 162,115 182,126"/>
      <path d="M130,124 C146,121 164,125 182,136"/>
      <path d="M138,132 C152,131 166,134 178,142"/>
    </g>

    <!-- Black plume over the tail -->
    <g fill="none" stroke="#1D2F4A" stroke-linecap="round">
      <path d="M170,122 C182,128 190,138 194,152" stroke-width="3"/>
      <path d="M166,126 C176,134 182,144 184,156" stroke-width="2.4"/>
      <path d="M174,118 C188,122 198,130 204,142" stroke-width="2.2"/>
      <path d="M162,130 C170,138 174,148 174,158" stroke-width="1.8"/>
    </g>

    <!-- Bare black neck and head -->
    <path d="M104,120 C96,108 92,92 94,76 L102,75 C102,90 106,104 114,112 Z" fill="#1D2F4A"/>
    <ellipse cx="98" cy="72" rx="7.5" ry="6.8" fill="#1D2F4A"/>
    <circle cx="100.5" cy="70" r="1.3" fill="#F8F9F5"/>

    <!-- Long, thin down-curved bill -->
    <path d="M92,70 C78,74 68,90 62,122 L64.6,122.6 C70,94 80,80 94,76 Z" fill="#1D2F4A"/>
    </g>
  </g>
</svg>
