<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 60 590 490" role="img" aria-labelledby="t"><title id="t">The Mile Zero ibis</title>
  <defs>
    <clipPath id="wing-clip-img"><ellipse cx="360" cy="300" rx="124" ry="78"/></clipPath>
  </defs>
  <g class="bird">
    <!-- Ground shadow -->
    <ellipse class="shadow" cx="362" cy="534" rx="118" ry="9" fill="#000" opacity=".12"/>
    <!-- Drooping black tail plumes, with feather barbs cut in -->
    <g class="plumes">
      <path d="M450 240 C522 236 584 286 604 372 C566 324 514 300 454 292 Z"/>
      <path d="M458 268 C520 280 566 330 574 414 C542 362 500 336 452 322 Z"/>
      <path d="M446 298 C500 318 532 368 528 440 C506 386 478 360 438 346 Z"/>
      <g class="barbs" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity=".9">
        <path d="M500 262 L526 290 M530 276 L552 308 M556 296 L574 330"/>
        <path d="M498 298 L516 330 M524 318 L540 352 M544 342 L556 376"/>
        <path d="M480 330 L494 360 M500 352 L510 384 M512 378 L518 408"/>
      </g>
    </g>
    <!-- Legs: scaled tarsus, backward joint, three toes forward and one hind toe -->
    <g class="legs" fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round">
      <path d="M330 396 L322 462 L330 524" stroke-width="11"/>
      <path d="M330 524 L292 532 M330 524 L346 536 M330 524 L360 526 M330 524 L318 514" stroke-width="7"/>
      <path d="M394 394 L404 460 L398 524" stroke-width="11"/>
      <path d="M398 524 L432 530 M398 524 L414 538 M398 524 L370 528 M398 524 L408 514" stroke-width="7"/>
    </g>
    <g class="scales" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
      <path d="M318 474 L334 476 M320 488 L336 490 M322 502 L336 503"/>
      <path d="M394 474 L410 472 M394 488 L408 486 M393 502 L406 501"/>
    </g>
    <circle cx="322" cy="462" r="7.5" fill="#000"/><circle cx="404" cy="460" r="7.5" fill="#000"/>
    <!-- The zero is the body -->
    <g class="zero">
      <ellipse cx="360" cy="300" rx="148" ry="102" fill="#fff" stroke="#E1251B" stroke-width="48"/>
      <!-- Folded wing: rows of scalloped feathers -->
      <g class="wing" clip-path="url(#wing-clip-img)" fill="none" stroke="#000" stroke-linecap="round">
        <path stroke-width="3.5" d="M292 262 C346 240 412 244 464 276"/>
        <path stroke-width="2.4" d="M296 276 a13.0 12 0 0 0 26 0 M322 276 a13.0 12 0 0 0 26 0 M348 276 a13.0 12 0 0 0 26 0 M374 276 a13.0 12 0 0 0 26 0 M400 276 a13.0 12 0 0 0 26 0 M426 276 a13.0 12 0 0 0 26 0 M452 276 a13.0 12 0 0 0 26 0"/>
        <path stroke-width="2.4" d="M309 296 a13.0 12 0 0 0 26 0 M335 296 a13.0 12 0 0 0 26 0 M361 296 a13.0 12 0 0 0 26 0 M387 296 a13.0 12 0 0 0 26 0 M413 296 a13.0 12 0 0 0 26 0 M439 296 a13.0 12 0 0 0 26 0 M465 296 a13.0 12 0 0 0 26 0"/>
        <path stroke-width="2.4" d="M296 316 a13.0 12 0 0 0 26 0 M322 316 a13.0 12 0 0 0 26 0 M348 316 a13.0 12 0 0 0 26 0 M374 316 a13.0 12 0 0 0 26 0 M400 316 a13.0 12 0 0 0 26 0 M426 316 a13.0 12 0 0 0 26 0 M452 316 a13.0 12 0 0 0 26 0"/>
        <path stroke-width="2.4" d="M322 336 a13.0 12 0 0 0 26 0 M348 336 a13.0 12 0 0 0 26 0 M374 336 a13.0 12 0 0 0 26 0 M400 336 a13.0 12 0 0 0 26 0 M426 336 a13.0 12 0 0 0 26 0"/>
      </g>
    </g>
    <!-- Bare black neck, tapering, with skin folds -->
    <path class="grow neck" d="M208 278 C178 230 166 170 176 112 L218 114 C210 168 222 220 262 258 Z"/>
    <g class="folds" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".55">
      <path d="M184 150 C192 154 202 154 210 150"/><path d="M182 176 C192 181 204 181 212 176"/>
      <path d="M186 204 C198 209 210 210 220 204"/><path d="M196 232 C208 237 222 238 234 232"/>
    </g>
    <!-- Head: eye with iris and highlight -->
    <g class="pop head">
      <ellipse cx="198" cy="100" rx="32" ry="27"/>
      <circle cx="210" cy="92" r="9" fill="#fff"/>
      <circle cx="211" cy="92" r="6" fill="#7a1e14"/>
      <circle cx="211" cy="92" r="3.2"/>
      <circle cx="213.5" cy="89.5" r="1.4" fill="#fff"/>
    </g>
    <!-- Long down-curved bill with nostril groove and a highlight along the top -->
    <g class="grow bill">
      <path d="M176 80 C122 92 80 152 60 262 C58 266 54 265 55 260 C70 150 112 102 176 112 Z"/>
      <path d="M168 90 C130 104 102 140 86 196" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".6"/>
      <path d="M170 84 C140 92 120 108 106 128" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".35"/>
    </g>
  </g>
</svg>
