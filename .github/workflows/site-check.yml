name: Site check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  built-pages-up-to-date:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check committed pages match src/ and site.config.json
        run: node scripts/build.mjs --check
