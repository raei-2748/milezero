<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{page.fullTitle}}</title>
<meta name="description" content="{{page.description}}">
<meta property="og:title" content="{{page.fullTitle}}">
<meta property="og:description" content="{{page.description}}">
<meta property="og:type" content="website">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/site.css">
<script>
  // The opening ibis plays once per visit (add ?intro to replay), never with reduced motion.
  try {
    var replay = location.search.indexOf("intro") > -1;
    if (location.pathname === "/" && (replay || !sessionStorage.getItem("mz-intro")) && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
      document.documentElement.classList.add("intro");
      sessionStorage.setItem("mz-intro", "1");
    }
  } catch (e) {}
</script>
<script src="/assets/js/links.js" defer></script>
<script src="/assets/js/site.js" defer></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="ibis" viewBox="0 0 64 56">
    <path d="M51 27 L62 36 L50 34 Z" fill="currentColor"/>
    <path d="M33 42 L32 53 M39 42 L40 53" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
    <ellipse cx="36" cy="32" rx="14" ry="9.5" fill="var(--ibis-fill, #fff)" stroke="#E1251B" stroke-width="5"/>
    <path d="M24 28 C21 22 20 16 21 11" stroke="currentColor" stroke-width="4" stroke-linecap="round" fill="none"/>
    <circle cx="21" cy="10" r="3.6" fill="currentColor"/>
    <path d="M19 9 C14 10 10 16 8 26" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  </symbol>
</svg>
<a class="skip" href="#main">Skip to content</a>
{{> header}}
<main id="main">
{{@content}}
</main>
{{> footer}}
</body>
</html>
