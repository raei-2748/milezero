<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{page.fullTitle}}</title>
<meta name="description" content="{{page.description}}">
<meta property="og:title" content="{{page.fullTitle}}">
<meta property="og:description" content="{{page.description}}">
<meta property="og:type" content="website">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/site.css">
<script>
  // The opening ibis plays once per visit (add ?intro to replay), never with reduced motion.
  try {
    var replay = location.search.indexOf("intro") > -1;
    if (location.pathname === "/" && (replay || !sessionStorage.getItem("mz-intro")) && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
      document.documentElement.classList.add("intro");
      sessionStorage.setItem("mz-intro", "1");
    }
  } catch (e) {}
</script>
<script src="/assets/js/links.js" defer></script>
<script src="/assets/js/site.js" defer></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="ibis" viewBox="0 0 64 56">
    <g transform="scale(.1)">
      <path d="M450 240 C522 236 584 286 604 372 C566 324 514 300 454 292 Z M458 268 C520 280 566 330 574 414 C542 362 500 336 452 322 Z M446 298 C500 318 532 368 528 440 C506 386 478 360 438 346 Z" fill="currentColor"/>
      <path d="M330 396 L322 462 L330 524 L294 532 M394 394 L404 460 L398 524 L434 530" fill="none" stroke="currentColor" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M208 278 C178 230 166 170 176 112 L218 114 C210 168 222 220 262 258 Z" fill="currentColor"/><ellipse cx="360" cy="300" rx="148" ry="102" fill="var(--ibis-fill, #fff)" stroke="#E1251B" stroke-width="52"/>
      
      <ellipse cx="198" cy="100" rx="34" ry="29" fill="currentColor"/>
      <path d="M176 80 C122 92 80 152 60 262 C58 266 52 265 53 258 C70 150 112 102 176 114 Z" fill="currentColor"/>
    </g>
  </symbol>
</svg>
<a class="skip" href="#main">Skip to content</a>
{{> header}}
<main id="main">
{{@content}}
</main>
{{> footer}}
</body>
</html>
