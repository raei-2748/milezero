<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{page.fullTitle}}</title>
<meta name="description" content="{{page.description}}">
<meta property="og:title" content="{{page.fullTitle}}">
<meta property="og:description" content="{{page.description}}">
<meta property="og:type" content="website">
{{@seo}}
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/assets/img/favicon-192.png" sizes="192x192" type="image/png">
<link rel="icon" href="/assets/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="preload" href="/assets/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/site.css">
<script>
  // The opening ibis plays once per visit (add ?intro to replay), never with reduced motion.
  try {
    var replay = location.search.indexOf("intro") > -1;
    if (location.pathname === "/" && (replay || !sessionStorage.getItem("mz-intro")) && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
      document.documentElement.classList.add("intro");
      sessionStorage.setItem("mz-intro", "1");
    }
  } catch (e) {}
</script>
<script src="/assets/js/links.js" defer></script>
<script src="/assets/js/site.js" defer></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="ibis" viewBox="0 0 64 56">
    <g transform="scale(.1)">
      <path d="M450 240 C522 236 584 286 604 372 C566 324 514 300 454 292 Z M458 268 C520 280 566 330 574 414 C542 362 500 336 452 322 Z M446 298 C500 318 532 368 528 440 C506 386 478 360 438 346 Z" fill="currentColor"/>
      <path d="M326 398 L318 458 L328 520 L292 528 M392 396 L402 456 L394 518 L358 526" fill="none" stroke="currentColor" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M214 272 C186 228 178 172 184 116 L218 116 C214 168 224 214 258 250 Z" fill="currentColor"/><ellipse cx="360" cy="300" rx="148" ry="102" fill="var(--ibis-fill, #fff)" stroke="var(--ibis-ring, #E1251B)" stroke-width="52"/>
      <ellipse cx="199" cy="102" rx="33" ry="28" fill="currentColor"/><circle cx="208" cy="96" r="7.5" fill="var(--ibis-fill, #fff)"/>
      <path d="M178 84 C124 96 84 154 62 262 C60 267 54 266 55 260 C72 152 114 106 180 114 Z" fill="currentColor"/>
    </g>
  </symbol>
</svg>
<a class="skip" href="#main">Skip to content</a>
{{> header}}
<main id="main">
{{@content}}
</main>
{{> footer}}
</body>
</html>
